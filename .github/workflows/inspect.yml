name: inspect
on:
  push:
    branches: [inspect-sources]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew && ./gradlew build --no-configuration-cache -q || true
      - name: dump
        run: |
          find "$HOME/.gradle" "$PWD/.gradle" -name "*minecraft*.jar" 2>/dev/null | grep -v sources
          for JAR in $(find "$HOME/.gradle" "$PWD/.gradle" -name "*minecraft*.jar" 2>/dev/null | grep -v sources); do
            for C in $(unzip -l "$JAR" | grep -oE "net/minecraft/[A-Za-z/]*/(Villager|AbstractVillager|MerchantOffer)\.class"); do
              CN=$(echo "${C%.class}" | tr / .)
              echo "########## $CN in $JAR"
              javap -p -c -cp "$JAR" "$CN" | awk '/(startTrading|updateSpecialPrices|stopTrading|resetSpecialPrices|mobInteract|getCostA|getModifiedCostCount|addToSpecialPriceDiff|setTradingPlayer|openTradingScreen)\(/{p=1} p&&/invoke|getfield|putfield|\(|Code:/{print} p&&/^$/{p=0;print "-----"}'
            done
          done
